<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biodata Siswa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page-shell form-shell">
    <header class="form-heading">
      <p class="eyebrow">RPL 3 / Profil Siswa</p>
      <h1>Biodata siswa</h1>
    </header>

    <form id="biodataForm" class="form-panel">
      <div class="form-grid">
        <div class="field field-wide">
          <label for="nama">Nama lengkap</label>
          <input type="text" id="nama" autocomplete="name" required>
        </div>

        <div class="field field-wide">
          <label for="alamat">Alamat</label>
          <textarea id="alamat" rows="4" required></textarea>
        </div>

        <div class="field">
          <fieldset>
            <legend>Jenis kelamin</legend>
            <div class="radio-options">
              <label><input type="radio" name="jk" value="Pria" required> Pria</label>
              <label><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
              <label><input type="radio" name="jk" value="Pria"> Boti</label>
            </div>
          </fieldset>
        </div>

        <div class="field">
          <label for="jurusan">Jurusan</label>
          <select id="jurusan">
            <option value="RPL">RPL</option>
            <option value="TKR">TKR</option>
            <option value="TEI">TEI</option>
            <option value="TKJ">TKJ</option>
            <option value="TSM">TSM</option>
          </select>
        </div>

        <div class="field">
          <label for="tinggi">Tinggi badan (cm)</label>
          <input type="number" id="tinggi" min="1" inputmode="numeric">
        </div>

        <div class="field">
          <label for="berat">Berat badan (kg)</label>
          <input type="number" id="berat" min="1" inputmode="numeric">
        </div>

        <div class="field">
          <label for="hobi">Hobi</label>
          <input type="text" id="hobi">
        </div>

        <div class="field">
          <label for="nohp">Nomor HP</label>
          <input type="tel" id="nohp" autocomplete="tel" inputmode="tel">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit">Simpan biodata</button>
      </div>
    </form>
  </main>

  <script>
    document.getElementById('biodataForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const dataSiswa = {
        nama: document.getElementById('nama').value,
        alamat: document.getElementById('alamat').value,
        jk: document.querySelector('input[name="jk"]:checked')?.value || '',
        jurusan: document.getElementById('jurusan').value,
        tinggi: document.getElementById('tinggi').value,
        berat: document.getElementById('berat').value,
        hobi: document.getElementById('hobi').value,
        nohp: document.getElementById('nohp').value
      };

      localStorage.setItem('dataSiswa', JSON.stringify(dataSiswa));
      window.location.href = 'hasil_biodata.html';
    });
  </script>

</body>
</html>
